name: Hana Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          GITHUB_PAGES: true
        run: |
          pnpm check
          pnpm build
          cp dist/public/index.html dist/public/404.html
          find dist/public -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | xargs -0 sed -i 's#"/assets/#"/hana-career-companion/assets/#g; s#url(/assets/#url(/hana-career-companion/assets/#g; s#"/manus-storage/#"/hana-career-companion/manus-storage/#g'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
