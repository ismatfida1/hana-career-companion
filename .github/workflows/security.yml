name: Hana Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (production runtime)
        continue-on-error: true
        run: |
          echo 'Running production dependency audit. Advisories are reported while dependency upgrades are handled separately.'
          pnpm audit --prod --audit-level=high || true
      - name: Check for accidentally committed API keys
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.lock' '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|OPENAI_API_KEY=[^$[:space:]]+|GEMINI_API_KEY=[^$[:space:]]+|DEEPSEEK_API_KEY=[^$[:space:]]+)' .; then
            echo 'Potential API secret found in repository contents.'
            exit 1
          fi
